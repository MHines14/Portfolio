      const __TWEAKS_STYLE = `

    background:transparent;flex-shrink:0}

      // ── useTweaks ───────────────────────────────────────────────────────────────
      // Single source of truth for tweak values. setTweak persists via the host
      // (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
      function useTweaks(defaults) {
        const [values, setValues] = React.useState(defaults);
        // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
        // useState-style call doesn't write a "[object Object]" key into the persisted
        // JSON block.
        const setTweak = React.useCallback((keyOrEdits, val) => {
          const edits = typeof keyOrEdits === "object" && keyOrEdits !== null ? keyOrEdits : { [keyOrEdits]: val };
          setValues((prev) => ({ ...prev, ...edits }));
          window.parent.postMessage({ type: "__edit_mode_set_keys", edits }, "*");
        }, []);
        return [values, setTweak];
      }

      // ── TweaksPanel ─────────────────────────────────────────────────────────────
      // Floating shell. Registers the protocol listener BEFORE announcing
      // availability — if the announce ran first, the host's activate could land
      // before our handler exists and the toolbar toggle would silently no-op.
      // The close button posts __edit_mode_dismissed so the host's toolbar toggle
      // flips off in lockstep; the host echoes __deactivate_edit_mode back which
      // is what actually hides the panel.
      function TweaksPanel({ title = "Tweaks", children }) {
        const [open, setOpen] = React.useState(false);
        const dragRef = React.useRef(null);
        const offsetRef = React.useRef({ x: 16, y: 16 });
        const PAD = 16;

        const clampToViewport = React.useCallback(() => {
          const panel = dragRef.current;
          if (!panel) return;
          const w = panel.offsetWidth,
            h = panel.offsetHeight;
          const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
          const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
          offsetRef.current = {
            x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
            y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
          };
          panel.style.right = offsetRef.current.x + "px";
          panel.style.bottom = offsetRef.current.y + "px";
        }, []);

        React.useEffect(() => {
          if (!open) return;
          clampToViewport();
          if (typeof ResizeObserver === "undefined") {
            window.addEventListener("resize", clampToViewport);
            return () => window.removeEventListener("resize", clampToViewport);
          }
          const ro = new ResizeObserver(clampToViewport);
          ro.observe(document.documentElement);
          return () => ro.disconnect();
        }, [open, clampToViewport]);

        React.useEffect(() => {
          const onMsg = (e) => {
            const t = e?.data?.type;
            if (t === "__activate_edit_mode") setOpen(true);
            else if (t === "__deactivate_edit_mode") setOpen(false);
          };
          window.addEventListener("message", onMsg);
          window.parent.postMessage({ type: "__edit_mode_available" }, "*");
          return () => window.removeEventListener("message", onMsg);
        }, []);

        const dismiss = () => {
          setOpen(false);
          window.parent.postMessage({ type: "__edit_mode_dismissed" }, "*");
        };

        const onDragStart = (e) => {
          const panel = dragRef.current;
          if (!panel) return;
          const r = panel.getBoundingClientRect();
          const sx = e.clientX,
            sy = e.clientY;
          const startRight = window.innerWidth - r.right;
          const startBottom = window.innerHeight - r.bottom;
          const move = (ev) => {
            offsetRef.current = {
              x: startRight - (ev.clientX - sx),
              y: startBottom - (ev.clientY - sy),
            };
            clampToViewport();
          };
          const up = () => {
            window.removeEventListener("mousemove", move);
            window.removeEventListener("mouseup", up);
          };
          window.addEventListener("mousemove", move);
          window.addEventListener("mouseup", up);
        };

        if (!open) return null;
        return (
          <>
            <style>{__TWEAKS_STYLE}</style>
            <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
              <div className="twk-hd" onMouseDown={onDragStart}>
                <b>{title}</b>
                <button className="twk-x" aria-label="Close tweaks" onMouseDown={(e) => e.stopPropagation()} onClick={dismiss}>
                  ✕
                </button>
              </div>
              <div className="twk-body">{children}</div>
            </div>
          </>
        );
      }

      // ── Layout helpers ──────────────────────────────────────────────────────────

      function TweakSection({ label, children }) {
        return (
          <>
            <div className="twk-sect">{label}</div>
            {children}
          </>
        );
      }

      function TweakRow({ label, value, children, inline = false }) {
        return (
          <div className={inline ? "twk-row twk-row-h" : "twk-row"}>
            <div className="twk-lbl">
              <span>{label}</span>
              {value != null && <span className="twk-val">{value}</span>}
            </div>
            {children}
          </div>
        );
      }

      // ── Controls ────────────────────────────────────────────────────────────────

      function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = "", onChange }) {
        return (
          <TweakRow label={label} value={`${value}${unit}`}>
            <input type="range" className="twk-slider" min={min} max={max} step={step} value={value} onChange={(e) => onChange(Number(e.target.value))} />
          </TweakRow>
        );
      }

      function TweakToggle({ label, value, onChange }) {
        return (
          <div className="twk-row twk-row-h">
            <div className="twk-lbl">
              <span>{label}</span>
            </div>
            <button type="button" className="twk-toggle" data-on={value ? "1" : "0"} role="switch" aria-checked={!!value} onClick={() => onChange(!value)}>
              <i />
            </button>
          </div>
        );
      }

      function TweakRadio({ label, value, options, onChange }) {
        const trackRef = React.useRef(null);
        const [dragging, setDragging] = React.useState(false);
        const opts = options.map((o) => (typeof o === "object" ? o : { value: o, label: o }));
        const idx = Math.max(
          0,
          opts.findIndex((o) => o.value === value),
        );
        const n = opts.length;

        // The active value is read by pointer-move handlers attached for the lifetime
        // of a drag — ref it so a stale closure doesn't fire onChange for every move.
        const valueRef = React.useRef(value);
        valueRef.current = value;

        const segAt = (clientX) => {
          const r = trackRef.current.getBoundingClientRect();
          const inner = r.width - 4;
          const i = Math.floor(((clientX - r.left - 2) / inner) * n);
          return opts[Math.max(0, Math.min(n - 1, i))].value;
        };

        const onPointerDown = (e) => {
          setDragging(true);
          const v0 = segAt(e.clientX);
          if (v0 !== valueRef.current) onChange(v0);
          const move = (ev) => {
            if (!trackRef.current) return;
            const v = segAt(ev.clientX);
            if (v !== valueRef.current) onChange(v);
          };
          const up = () => {
            setDragging(false);
            window.removeEventListener("pointermove", move);
            window.removeEventListener("pointerup", up);
          };
          window.addEventListener("pointermove", move);
          window.addEventListener("pointerup", up);
        };

        return (
          <TweakRow label={label}>
            <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown} className={dragging ? "twk-seg dragging" : "twk-seg"}>
              <div className="twk-seg-thumb" style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`, width: `calc((100% - 4px) / ${n})` }} />
              {opts.map((o) => (
                <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
                  {o.label}
                </button>
              ))}
            </div>
          </TweakRow>
        );
      }

      function TweakSelect({ label, value, options, onChange }) {
        return (
          <TweakRow label={label}>
            <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
              {options.map((o) => {
                const v = typeof o === "object" ? o.value : o;
                const l = typeof o === "object" ? o.label : o;
                return (
                  <option key={v} value={v}>
                    {l}
                  </option>
                );
              })}
            </select>
          </TweakRow>
        );
      }

      function TweakText({ label, value, placeholder, onChange }) {
        return (
          <TweakRow label={label}>
            <input className="twk-field" type="text" value={value} placeholder={placeholder} onChange={(e) => onChange(e.target.value)} />
          </TweakRow>
        );
      }

      function TweakNumber({ label, value, min, max, step = 1, unit = "", onChange }) {
        const clamp = (n) => {
          if (min != null && n < min) return min;
          if (max != null && n > max) return max;
          return n;
        };
        const startRef = React.useRef({ x: 0, val: 0 });
        const onScrubStart = (e) => {
          e.preventDefault();
          startRef.current = { x: e.clientX, val: value };
          const decimals = (String(step).split(".")[1] || "").length;
          const move = (ev) => {
            const dx = ev.clientX - startRef.current.x;
            const raw = startRef.current.val + dx * step;
            const snapped = Math.round(raw / step) * step;
            onChange(clamp(Number(snapped.toFixed(decimals))));
          };
          const up = () => {
            window.removeEventListener("pointermove", move);
            window.removeEventListener("pointerup", up);
          };
          window.addEventListener("pointermove", move);
          window.addEventListener("pointerup", up);
        };
        return (
          <div className="twk-num">
            <span className="twk-num-lbl" onPointerDown={onScrubStart}>
              {label}
            </span>
            <input type="number" value={value} min={min} max={max} step={step} onChange={(e) => onChange(clamp(Number(e.target.value)))} />
            {unit && <span className="twk-num-unit">{unit}</span>}
          </div>
        );
      }

      function TweakColor({ label, value, onChange }) {
        return (
          <div className="twk-row twk-row-h">
            <div className="twk-lbl">
              <span>{label}</span>
            </div>
            <input type="color" className="twk-swatch" value={value} onChange={(e) => onChange(e.target.value)} />
          </div>
        );
      }

      function TweakButton({ label, onClick, secondary = false }) {
        return (
          <button type="button" className={secondary ? "twk-btn secondary" : "twk-btn"} onClick={onClick}>
            {label}
          </button>
        );
      }

      Object.assign(window, {
        useTweaks,
        TweaksPanel,
        TweakSection,
        TweakRow,
        TweakSlider,
        TweakToggle,
        TweakRadio,
        TweakSelect,
        TweakText,
        TweakNumber,
        TweakColor,
        TweakButton,
      });
    </script>

      function useTypewriter(words, speed = 80, pause = 1800) {
        const [display, setDisplay] = useState("");
        const [wordIdx, setWordIdx] = useState(0);
        const [charIdx, setCharIdx] = useState(0);
        const [deleting, setDeleting] = useState(false);
        useEffect(() => {
          const word = words[wordIdx];
          const delay = deleting ? speed / 2 : charIdx === word.length ? pause : speed;
          const t = setTimeout(() => {
            if (!deleting) {
              if (charIdx < word.length) {
                setDisplay(word.slice(0, charIdx + 1));
                setCharIdx((c) => c + 1);
              } else {
                setDeleting(true);
              }
            } else {
              if (charIdx > 0) {
                setDisplay(word.slice(0, charIdx - 1));
                setCharIdx((c) => c - 1);
              } else {
                setDeleting(false);
                setWordIdx((i) => (i + 1) % words.length);
              }
            }
          }, delay);
          return () => clearTimeout(t);
        }, [charIdx, deleting, wordIdx, words, speed, pause]);
        return display;
      }

      function useIntersection(ref, threshold = 0.15) {
        const [visible, setVisible] = useState(false);
        useEffect(() => {
          const obs = new IntersectionObserver(
            ([e]) => {
              if (e.isIntersecting) {
                setVisible(true);
                obs.disconnect();
              }
            },
            { threshold },
          );
          if (ref.current) obs.observe(ref.current);
          return () => obs.disconnect();
        }, [ref, threshold]);
        return visible;
      }

                      <SkillItem key={si} name={s.name} icon={s.icon} />
                    ))}
                  </div>
                ))}
              </div>
            </div>
          </section>
        );
      }

      function ProjectsSection() {
        const [filter, setFilter] = useState("all");
        const cats = ["all", "ml", "viz", "eng", "analysis"];
        const catLabels = { all: "Featured", ml: "Tableau", viz: "Power BI", eng: "Sports Data", analysis: "SQL" };
        const visible = filter === "all" ? ALL_PROJECTS : ALL_PROJECTS.filter((p) => p.category === filter);
        return (
          <section id="projects" className="section">
            <div className="container">
              <div className="section-header">
                <div className="section-label">Selected Work</div>
                <h2 className="section-title">
                  Featured <span>Projects</span>
                </h2>
                <p className="section-sub">A selection of work spanning predictive modeling, BI dashboards, and data engineering.</p>
              </div>
              <div className="filter-tabs">
                {cats.map((c) => (
                  <button key={c} className={`filter-tab ${filter === c ? "active" : ""}`} onClick={() => setFilter(c)}>
                    {catLabels[c]}
                  </button>
                ))}
              </div>
              <div className="projects-grid">
                {visible.map((p, i) => (
                  <a key={i} href={p.page || "#projects"} className="project-card" style={{ display: "block", textDecoration: "none", color: "inherit" }}>
                    <div
                      className="project-thumb"
                      style={{
                        background: p.img ? "none" : `repeating-linear-gradient(...)`,
                        padding: 0,
                        overflow: "hidden",
                        borderRadius: "0", // parent card clips it
                      }}
                    >
                      {p.img ? (
                        <img
                          src={p.img}
                          alt={p.title}
                          style={{
                            width: "100%",
                            height: "100%",
                            objectFit: "cover",
                            objectPosition: "top",
                            display: "block",
                          }}
                        />
                      ) : (
                        <div className="project-thumb-inner" style={{ color: p.accent }}>
                          {p.thumb}
                        </div>
                      )}
                    </div>
                    <div className="project-body">
                      <div className="project-type">{p.type}</div>
                      <div className="project-title">{p.title}</div>
                      <div className="project-desc">{p.desc}</div>
                      <div className="project-footer">
                        <div className="project-links">
                          <span className="project-link" title="View code">
                            ⌥
                          </span>
                          <span className="project-link" title="Live demo">
                            ↗
                          </span>
                        </div>
                        <div style={{ fontSize: 12, color: "var(--text-dim)", fontFamily: "var(--ff-mono)" }}>Case study →</div>
                      </div>
                    </div>
                  </a>
                ))}
              </div>
            </div>
          </section>
        );
      }

      // ── Main App ──────────────────────────────────────────────────────────────
      function App() {
        const [mobileOpen, setMobileOpen] = useState(false);
        const [tweaks] = useTweaks(TWEAK_DEFAULTS);

        return (
          <div>
            <Navbar mobileOpen={mobileOpen} setMobileOpen={setMobileOpen} />

            <HeroSection />

            {/* About */}

            <ProjectsSection />

            {/* Experience */}
            <section id="experience" className="section" style={{ background: "var(--bg2)" }}>
              <div className="container">
                <div className="experience-grid" style={{ display: "grid", gridTemplateColumns: "1fr 1.5fr", gap: 60, alignItems: "start" }}>
                  <div style={{ position: "sticky", top: 100 }}>
                    <div className="section-label">Career Path</div>
                    <h2 className="section-title">
                      My <span>Journey</span>
                    </h2>
                    <p className="section-sub">Current college student pursing a degree in Data Analytics.</p>
                    <div style={{ marginTop: 40, display: "flex", flexDirection: "column", gap: 12 }}>
                      {[
                        { label: "Industries", value: "Business · Health · Sports" },
                        { label: "Stack", value: "Excel · SQL · Tableau · Python  · Git " },
                        { label: "Education", value: "B.S. Business Data Analytics" },
                      ].map((item) => (
                        <div
                          key={item.label}
                          style={{ display: "flex", justifyContent: "space-between", padding: "12px 0", borderBottom: "1px solid var(--border)" }}
                        >
                          <span
                            style={{
                              fontFamily: "var(--ff-mono)",
                              fontSize: 12,
                              color: "var(--text-dim)",
                              textTransform: "uppercase",
                              letterSpacing: "0.08em",
                            }}
                          >
                            {item.label}
                          </span>
                          <span style={{ fontSize: 13, color: "var(--text-muted)" }}>{item.value}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                  <div className="timeline">
                    {TIMELINE.map((item, i) => (
                      <div key={i} className="timeline-item">
                        <div className="timeline-dot"></div>
                        <div className="timeline-date">{item.date}</div>
                        <div className="timeline-role">{item.role}</div>
                        <div className="timeline-company">{item.company || item.major}</div>
                        <div className="timeline-desc">{item.desc}</div>
                        {item.highlights && item.highlights.length > 0 && (
                          <ul className="timeline-list">
                            {item.highlights.map((h, hi) => (
                              <li key={hi}>{h}</li>
                            ))}
                          </ul>
                        )}
                        <div className="timeline-tags">
                          {item.tags.map((t) => (
                            <span key={t} className="tag">
                              {t}
                            </span>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </section>

            <SkillsSection />

            <ContactSection />

            <footer>
              <div className="footer-inner">
                <div className="footer-copy">© 2026 Matthew Hines · Built with intentional data</div>
              </div>
            </footer>

            <TweaksPanel>
              <TweakSection title="Accent Color">
                <TweakRadio id="accentColor" options={["cyan", "mint", "violet"]} />
              </TweakSection>
              <TweakSection title="Typography">
                <TweakRadio id="fontStyle" options={["sharp", "rounded", "mono"]} />
              </TweakSection>
              <TweakSection title="Layout">
                <TweakToggle id="showStats" label="Show hero stats" />
              </TweakSection>
            </TweaksPanel>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
